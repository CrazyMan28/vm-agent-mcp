[project]
name = "vm-agent"
version = "0.1.0"
description = "MCP server that lets AI agents act like they're on this machine: shell, files, desktop, input."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "mss>=9.0",
    "pillow>=10.0",
    "pyperclip>=1.8",
    "pyautogui>=0.9.54",
]

[project.scripts]
vm-agent-mcp = "vm_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vm_agent"]
